<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">SAMPLE</title>
  <desc id="desc">Five equally spaced sampling stems with sampled values highlighted in orange.</desc>
  <!-- Dyad supplies connectors and port labels; the side lanes stay clear. -->
  <rect x="50" y="50" width="900" height="900" rx="16" fill="#ffffff" stroke="#0a0a0a" stroke-width="16"/>
  <text x="500" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="600" fill="#0a0a0a">SAMPLE</text>
  <g fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 280 690 H 720"/>
<path d="M 300 690 V 510 M 400 690 V 370 M 500 690 V 410 M 600 690 V 560 M 700 690 V 480"/>
<g fill="#ff5a1f" stroke="none">
  <circle cx="300" cy="510" r="24"/><circle cx="400" cy="370" r="24"/>
  <circle cx="500" cy="410" r="24"/><circle cx="600" cy="560" r="24"/><circle cx="700" cy="480" r="24"/>
