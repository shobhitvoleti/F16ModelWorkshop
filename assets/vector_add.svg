<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="150" y="150" width="700" height="700" rx="40" fill="url(#body)" stroke="#334155" stroke-width="6"/>

  <!-- Signal paths: two inputs (left, from port anchors) converge into the node, one output (right) -->
  <line x1="50"  y1="230" x2="500" y2="500" stroke="#64748B" stroke-width="7"/>
  <line x1="50"  y1="760" x2="500" y2="500" stroke="#64748B" stroke-width="7"/>
  <line x1="500" y1="500" x2="950" y2="500" stroke="#334155" stroke-width="7"/>

  <!-- Signal flow: two inputs combine into one output -->
  <circle r="12" fill="#64748B">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 50 230 L 500 500"/>
  </circle>
  <circle r="12" fill="#64748B">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 50 760 L 500 500"/>
  </circle>
  <circle r="12" fill="#334155">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 500 500 L 950 500"/>
  </circle>

  <!-- Summation node -->
  <circle cx="500" cy="500" r="95" fill="#F8FAFC" stroke="#334155" stroke-width="6"/>
  <text x="500" y="512" font-family="serif" font-size="120" fill="#334155" text-anchor="middle" dominant-baseline="middle">&#931;</text>

  <!-- Ports (vector, concentric) at the _links box CENTERS = Dyad port anchors: u1(50,230) u2(50,760) y(950,500) -->
  <circle cx="50"  cy="230" r="18" fill="#334155"/><circle cx="50"  cy="230" r="10" fill="#FFFFFF"/><circle cx="50"  cy="230" r="6" fill="#334155"/>
  <circle cx="50"  cy="760" r="18" fill="#334155"/><circle cx="50"  cy="760" r="10" fill="#FFFFFF"/><circle cx="50"  cy="760" r="6" fill="#334155"/>
  <circle cx="950" cy="500" r="18" fill="#334155"/><circle cx="950" cy="500" r="10" fill="#FFFFFF"/><circle cx="950" cy="500" r="6" fill="#334155"/>

  <!-- Labels (inside body) -->
  <text x="210" y="300" font-family="monospace" font-size="44" fill="#64748B" text-anchor="start">u1</text>
  <text x="210" y="700" font-family="monospace" font-size="44" fill="#64748B" text-anchor="start">u2</text>
  <text x="790" y="470" font-family="monospace" font-size="44" fill="#64748B" text-anchor="end">y</text>
</svg>
