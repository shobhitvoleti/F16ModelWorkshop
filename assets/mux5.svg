<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="muxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b9bd5;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#5b9bd5;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Trapezoid body: wide on left (inputs), narrow on right (output) -->
  <polygon
    points="150,10 850,400 850,600 150,990"
    fill="url(#muxGrad)"
    stroke="#5b9bd5"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Input signal lines from port edge to trapezoid left face -->
  <g stroke="#5b9bd5" stroke-width="4" fill="none">
    <line x1="100" y1="50"  x2="150" y2="50"  />
    <line x1="100" y1="260" x2="150" y2="260" />
    <line x1="100" y1="500" x2="150" y2="500" />
    <line x1="100" y1="720" x2="150" y2="720" />
    <line x1="100" y1="950" x2="150" y2="950" />
  </g>

  <!-- Converging lines inside the trapezoid: each input to the output -->
  <g stroke="#5b9bd5" stroke-width="3" stroke-opacity="0.5" fill="none">
    <line x1="150" y1="50"  x2="850" y2="500" />
    <line x1="150" y1="260" x2="850" y2="500" />
    <line x1="150" y1="500" x2="850" y2="500" />
    <line x1="150" y1="720" x2="850" y2="500" />
    <line x1="150" y1="950" x2="850" y2="500" />
  </g>

  <!-- Output signal line from trapezoid right face to port edge -->
  <line x1="850" y1="500" x2="900" y2="500"
        stroke="#5b9bd5" stroke-width="4" />

  <!-- Input port dots -->
  <g fill="#5b9bd5">
    <circle cx="100" cy="50"  r="14" />
    <circle cx="100" cy="260" r="14" />
    <circle cx="100" cy="500" r="14" />
    <circle cx="100" cy="720" r="14" />
    <circle cx="100" cy="950" r="14" />
  </g>

  <!-- Output port dot (vector) -->
  <circle cx="900" cy="500" r="18" fill="#2e75b6" />
  <circle cx="900" cy="500" r="10" fill="white" />
  <circle cx="900" cy="500" r="6"  fill="#2e75b6" />

  <!-- Input labels -->
  <g font-family="monospace" font-size="48" fill="#2e75b6" text-anchor="end" dominant-baseline="middle">
    <text x="75" y="50">u1</text>
    <text x="75" y="260">u2</text>
    <text x="75" y="500">u3</text>
    <text x="75" y="720">u4</text>
    <text x="75" y="950">u5</text>
  </g>

  <!-- Output label -->
  <text x="925" y="500" font-family="monospace" font-size="48" fill="#2e75b6"
        text-anchor="start" dominant-baseline="middle">y</text>

  <!-- Title -->
  <text x="500" y="500" font-family="sans-serif" font-weight="bold" font-size="72"
        fill="#2e75b6" text-anchor="middle" dominant-baseline="middle" opacity="0.6">
    MUX
  </text>
</svg>
