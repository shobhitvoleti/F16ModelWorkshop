<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">HOLD</title>
  <desc id="desc">Piecewise-constant staircase: each sample is held until the next update.</desc>
  <!-- Dyad supplies connectors and port labels; the side lanes stay clear. -->
  <rect x="50" y="50" width="900" height="900" rx="16" fill="#ffffff" stroke="#0a0a0a" stroke-width="16"/>
  <text x="500" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="600" fill="#0a0a0a">HOLD</text>
  <g fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 280 690 H 720"/>
<path d="M 280 560 H 390 V 370 H 500 V 440 H 610 V 540 H 720"/>
<path d="M 390 370 H 500" stroke="#ff5a1f"/>
  </g>
</svg>
