  <text x="500" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="600" fill="#0a0a0a">POSE</text>
  <g fill="none" stroke="#0a0a0a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 500 530 L 320 650 M 500 530 L 680 650"/>
<path d="M 500 530 V 330" stroke="#ff5a1f"/>
<circle cx="500" cy="530" r="18" fill="#0a0a0a" stroke="none"/>
<g stroke="none" fill="#0a0a0a" font-family="'Courier New', monospace" font-size="88" text-anchor="middle">
